name: Release

# Publishing a GitHub Release (tag = version in comtrade.py, e.g. "0.1.3")
# runs CI and uploads the built sdist and wheel to PyPI via Trusted Publishing.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/comtrade/${{ github.event.release.tag_name }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Check the release tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ls dist/
          if [ ! -f "dist/comtrade-${TAG#v}.tar.gz" ]; then
            echo "::error::Release tag '$TAG' does not match __version__ in comtrade.py"
            exit 1
          fi
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
